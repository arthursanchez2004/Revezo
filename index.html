<style>

  notif(_,v){S.notif[v]=!S.notif[v]},
  copy(){const t=summary(),sel=()=>{const r=document.createRange();r.selectNodeContents($("sum"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Resumo selecionado. Agora é só copiar.");paintLayer()};try{navigator.clipboard.writeText(t).then(()=>{toast("Resumo copiado");paintLayer()},sel)}catch(e){sel()}return true},
  easy(){S.easy=!S.easy;S.pop=null}, bell(){S.pop=S.pop==="bell"?null:"bell"}, more(){S.pop="more"}, close(){S.pop=null},
  sos(){S.sos=true;S.pop="sos";S.feed.unshift([S.easy?"m":S.me,S.easy?"recebeu um pedido de ajuda":"acionou o SOS","agora"])},
  sosok(){S.sos=false;S.pop=null;log(S.me,"está indo até a Dona Lúcia");toast("A família foi avisada de que você está a caminho")},
  soscancel(){S.sos=false;S.pop=null;toast("SOS cancelado. A família foi avisada.")},
  easymed(){const t=S.tasks.find(t=>t.ty==="remedio"&&!t.by);if(t){t.by=S.week[DOW];if(t.med!=null)S.meds[t.med].qtd=Math.max(0,S.meds[t.med].qtd-1);S.feed.unshift([S.week[DOW],"recebeu a confirmação: "+t.b,"agora"]);toast("Muito bem. A família já sabe.")}},
  askcall(_,v){S.callAsk=v;toast(P[v].n+" recebeu o seu pedido")}, called(){S.callAsk=null;S.contacts.unshift({by:S.me,k:"Ligação",w:"Agora"});toast("Ligação registrada")}
};
const F={
  task(){S.tasks.push({t:$("tk-h").value,b:$("tk-b").value.trim(),s:"Adicionada por "+P[S.me].n,ty:$("tk-ty").value,by:null});sortTasks();toast("Tarefa adicionada")},
  med(){const q=parseInt($("md-q").value,10);if(!(q>0)){$("md-q").value="";$("md-q").placeholder="Só números";return false}const n=$("md-n").value.trim(),d=$("md-d").value.trim(),h=$("md-h").value;S.meds.push({n,dose:d,uso:"Adicionado por "+P[S.me].n,h,qtd:q,dia:1,adh:[1,1,1,1,1,1,1],rx:90});S.tasks.push({t:h,b:n+" "+d,s:"1 dose",ty:"remedio",med:S.meds.length-1,by:null});sortTasks();toast("Remédio adicionado à rotina")},
  vit(){const m=S.vit[S.metric],p=id=>parseFloat($(id).value.replace(",",".")),a=p("vt-a"),b=m.v2?p("vt-b"):1;if(!(a>0)){$("vt-a").value="";$("vt-a").placeholder="Digite um número";return false}if(!(b>0)){$("vt-b").value="";$("vt-b").placeholder="Digite um número";return false}m.v.push(a);m.v.shift();if(m.v2){m.v2.push(b);m.v2.shift()}log(S.me,"registrou "+m.n.toLowerCase());toast("Medição registrada")},
  appt(){S.appts.push({d:+$("ap-d").value,h:$("ap-h").value,b:$("ap-b").value.trim(),doc:$("ap-doc").value.trim(),loc:"local a confirmar",by:null,q:[]});S.appts.sort((a,b)=>a.d-b.d);toast("Consulta marcada")},
  q(i){S.appts[i].q.push($("q"+i).value.trim())},
  cost(){const v=parseFloat($("cs-v").value.replace(/[^\d,.]/g,"").replace(",","."));if(!(v>0)){$("cs-v").value="";$("cs-v").placeholder="Ex.: 35,90";return false}if(!FAM.includes(S.me)){toast("Só os familiares lançam gastos");paintLayer();return false}const b=$("cs-b").value.trim();S.costs.unshift({b,v,by:S.me,cat:$("cs-c").value});log(S.me,"lançou "+b);toast("Gasto lançado e acerto recalculado")},
  note(){S.notes.unshift({by:S.me,w:"Agora",tag:$("nt-t").value,x:$("nt-x").value.trim()});S.tag="Todos";log(S.me,"escreveu no diário")},
  contact(){S.contacts.unshift({by:S.me,k:$("ct-k").value,w:"Agora"});toast("Contato registrado")},
  fall(){S.falls.unshift({w:"Hoje",x:$("fl-x").value.trim()});log(S.me,"registrou uma queda");toast("Queda registrada e família avisada")},
  doc(){const v=$("dc-v").value;S.docs.unshift([$("dc-n").value.trim(),v===""?null:+v]);toast("Documento guardado")},
  invite(){const n=$("iv-n").value.trim(),k="x"+S.members.length;P[k]={n,c:"var(--muted)",r:$("iv-r").value};S.members.push([k,"Convite enviado"]);toast("Convite enviado para "+n)}
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go],[data-me],[data-a]");
  if(!b){if(S.pop==="bell"&&!e.target.closest(".pop")){S.pop=null;paintLayer()}return}
  if(b.dataset.a==="close"&&e.target!==b)return;
  if(b.dataset.me){S.me=b.dataset.me;render(true);return}
  if(b.dataset.a){if(A[b.dataset.a](b.dataset.i!=null?+b.dataset.i:null,b.dataset.v))return;render(true);return}
  if(b.dataset.go){S.tab=b.dataset.go;S.pop=null;render()}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.f;if(!f)return;if(F[f](e.target.dataset.i!=null?+e.target.dataset.i:null)!==false)render(true)});
render();
</script>

</body></html>
